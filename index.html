<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七年级 12 班</title>
<link rel="stylesheet" href="style.css">
<style>
.about-content{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:2rem;margin-bottom:3rem}
.about-card.collapsible{cursor:pointer}
.collapsible-header{display:flex;justify-content:space-between;align-items:center}
.toggle-icon{transition:transform .3s}
.about-card.collapsible.active .toggle-icon{transform:rotate(180deg)}
.collapsible-content{max-height:0;overflow:hidden;transition:max-height .4s}
.about-card.collapsible.active .collapsible-content{max-height:500px}
.teacher-comments{margin-top:20px;border-top:2px solid #f0f0f0;padding-top:15px}
</style>
<script>
var disqus_shortname='qcba2013';
function loadTeacherComments(div,id){
if(!div||div.innerHTML.trim()!=='')return;
div.innerHTML='<div id="disqus_thread_'+id+'"></div>';
var dsq=document.createElement('script');
dsq.src='//'+disqus_shortname+'.disqus.com/embed.js';
dsq.async=true;
dsq.setAttribute('data-timestamp',+new Date());
dsq.setAttribute('data-disqus-identifier',id);
div.appendChild(dsq);
}
document.addEventListener('DOMContentLoaded',function(){
document.querySelectorAll('.about-card.collapsible').forEach(function(card){
var header=card.querySelector('.collapsible-header');
header.addEventListener('click',function(){
card.classList.toggle('active');
if(card.classList.contains('active')){
var div=card.querySelector('.teacher-comments');
if(div)loadTeacherComments(div,div.getAttribute('data-id'));
}
});
});
});
</script>
</head>
<body>
<nav class="navbar"><div class="container"><div class="logo">🏫七年级 12 班</div></div></nav>
<section id="about" class="section"><div class="container"><h2>📖班级介绍</h2>
<div class="about-content">
<div class="about-card collapsible"><h3 class="collapsible-header">班主任<span class="toggle-icon">▼</span></h3><div class="collapsible-content"><p>姓名：（待补充）</p><div class="teacher-comments" data-id="homeroom"></div></div></div>
<div class="about-card collapsible"><h3 class="collapsible-header">语文老师<span class="toggle-icon">▼</span></h3><div class="collapsible-content"><p>姓名：（待补充）</p><div class="teacher-comments" data-id="chinese"></div></div></div>
<div class="about-card collapsible"><h3 class="collapsible-header">数学老师<span class="toggle-icon">▼</span></h3><div class="collapsible-content"><p>姓名：（待补充）</p><div class="teacher-comments" data-id="math"></div></div></div>
<div class="about-card collapsible"><h3 class="collapsible-header">英语老师<span class="toggle-icon">▼</span></h3><div class="collapsible-content"><p>姓名：（待补充）</p><div class="teacher-comments" data-id="english"></div></div></div>
</div></div></section>
<section id="message" class="section"><div class="container"><h2>💬留言板</h2><div id="disqus_thread"></div></div></section>
<script>
(function(){
var dsq=document.createElement('script');
dsq.src='//'+disqus_shortname+'.disqus.com/embed.js';
dsq.async=true;
dsq.setAttribute('data-timestamp',+new Date());
(document.head||document.body).appendChild(dsq);
})();
</script>
</body>
</html>
