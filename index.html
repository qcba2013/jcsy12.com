<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七年级 12 班 - 我们的班级主页</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* 模态框样式 - 完美居中 */
#teacherModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    justify-content: center;
    align-items: center;
}

#teacherModal.active {
    display: flex;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 90%;
    max-width: 700px;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 2.5rem;
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    transition: color 0.3s;
    z-index: 2002;
    line-height: 1;
}

.modal-close:hover {
    color: #4a90d9;
}

.teacher-comments-section {
    margin-top: 25px;
    padding-top: 25px;
    border-top: 2px solid #f0f0f0;
}

/* 评论区通用样式 */
.comment-box textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
}

.comment-box button {
    margin-top: 12px;
    padding: 10px 24px;
    background: linear-gradient(135deg, #4a90d9, #67b26f);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
}

.comment-box button:hover {
    transform: translateY(-2px);
}

.comment-list {
    margin-top: 20px;
}

.comment-item {
    padding: 16px;
    border-bottom: 1px solid #eee;
    position: relative;
}

.comment-author {
    font-weight: bold;
    color: #4a90d9;
    margin-right: 10px;
}

.comment-text {
    color: #555;
    margin: 8px 0;
    line-height: 1.5;
}

.comment-time {
    font-size: 13px;
    color: #888;
    display: inline-block;
    margin-right: 15px;
}

.comment-actions {
    float: right;
}

.comment-delete {
    background: none;
    border: none;
    color: #ff6b6b;
    cursor: pointer;
    font-size: 14px;
    padding: 2px 8px;
    border-radius: 4px;
    opacity: 0.8;
}

.comment-delete:hover {
    opacity: 1;
    background: #ffebee;
}

/* 主页面样式保持不变 */
</style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🏫七年级 12 班</div>
        <ul class="nav-links">
            <li><a href="#home">首页</a></li>
            <li><a href="#about">班级介绍</a></li>
            <li><a href="#members">同学风采</a></li>
            <li><a href="#gallery">照片墙</a></li>
            <li><a href="#calendar">重要日期</a></li>
            <li><a href="#message">留言板</a></li>
        </ul>
    </div>
</nav>

<!-- 首页英雄区域 -->
<section id="home" class="hero">
    <div class="hero-content">
        <h1>欢迎来到七年级 12 班！</h1>
        <p class="slogan">团结友爱 · 勤奋学习 · 快乐成长</p>
        <a href="#about" class="btn">了解我们</a>
    </div>
</section>

<!-- 班级介绍 -->
<section id="about" class="section section-alt">
    <div class="container">
        <h2>班级介绍</h2>
        <p class="section-desc">我们的班级大家庭</p>
        
        <div class="about-content">
            <button class="teacher-btn" onclick="openTeacherModal('homeroom', '班主任')">
                <span class="btn-icon">👩‍🏫</span>
                <span>班主任</span>
            </button>
            <button class="teacher-btn" onclick="openTeacherModal('chinese', '语文老师')">
                <span class="btn-icon">📚</span>
                <span>语文老师</span>
            </button>
            <button class="teacher-btn" onclick="openTeacherModal('math', '数学老师')">
                <span class="btn-icon">🧮</span>
                <span>数学老师</span>
            </button>
            <button class="teacher-btn" onclick="openTeacherModal('english', '英语老师')">
                <span class="btn-icon">🌍</span>
                <span>英语老师</span>
            </button>
        </div>
    </div>
</section>

<!-- 同学风采、照片墙等其他部分保持不变 -->

<!-- 留言板 -->
<section id="message" class="section">
    <div class="container">
        <h2>💬 留言板</h2>
        <p class="section-desc">欢迎同学们留言、分享想法、提出建议！</p>
        
        <!-- 留言板评论区 -->
        <div class="comment-box">
            <textarea id="mainCommentInput" placeholder="写下你的留言..."></textarea>
            <button onclick="addMainComment()">发表留言</button>
        </div>
        <div id="mainCommentList" class="comment-list"></div>
    </div>
</section>

<!-- 老师模态框 -->
<div id="teacherModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeTeacherModal()">&times;</button>
        <div class="modal-header">
            <h3 id="teacherModalTitle">老师介绍</h3>
            <p id="teacherInfo"></p>
        </div>
        <div class="teacher-comments-section">
            <h4>评论区</h4>
            <div class="comment-box">
                <textarea id="teacherCommentInput" placeholder="写下你的评论..."></textarea>
                <button onclick="addTeacherComment()">发表评论</button>
            </div>
            <div id="teacherCommentList" class="comment-list"></div>
        </div>
    </div>
</div>

<script>
// 评论数据存储（使用 localStorage 持久化）
var commentsData = JSON.parse(localStorage.getItem('commentsData') || '{"homeroom":[],"chinese":[],"math":[],"english":[],"main":[]}');

// 当前打开的老师
var currentTeacher = null;

// 打开老师模态框
function openTeacherModal(identifier, title) {
    currentTeacher = identifier;
    
    // 设置标题和信息（待填写具体内容）
    document.getElementById('teacherModalTitle').textContent = title;
    document.getElementById('teacherInfo').textContent = '这里是' + title + '的详细介绍，欢迎补充内容！';
    
    // 显示模态框
    var modal = document.getElementById('teacherModal');
    modal.style.display = 'flex';
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    
    // 加载对应老师的评论
    loadCommentsForTeacher(identifier);
}

// 关闭模态框
function closeTeacherModal() {
    var modal = document.getElementById('teacherModal');
    modal.style.display = 'none';
    modal.classList.remove('active');
    document.body.style.overflow = '';
    currentTeacher = null;
}

// 加载指定老师的评论列表
function loadCommentsForTeacher(teacher) {
    var commentList = document.getElementById('teacherCommentList');
    var comments = commentsData[teacher] || [];
    
    if (comments.length === 0) {
        commentList.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无评论，快来发表第一个评论吧！</p>';
        return;
    }
    
    var html = '';
    comments.forEach(function(comment, index) {
        var timestamp = new Date(comment.timestamp);
        var timeStr = timestamp.toLocaleString();
        
        html += `
            <div class="comment-item" data-index="${index}">
                <div class="comment-author">${comment.author}</div>
                <div class="comment-text">${comment.text}</div>
                <div class="comment-time">${timeStr}</div>
                <div class="comment-actions">
                    <button class="comment-delete" onclick="removeTeacherComment(${index})">撤回</button>
                </div>
            </div>
        `;
    });
    
    commentList.innerHTML = html;
}

// 添加老师评论
function addTeacherComment() {
    if (!currentTeacher) return;
    
    var input = document.getElementById('teacherCommentInput');
    var text = input.value.trim();
    if (!text) {
        alert('请输入评论内容！');
        return;
    }
    
    // 创建评论对象
    var comment = {
        author: '访客',
        text: text,
        timestamp: Date.now()
    };
    
    // 保存到当前老师的评论数组
    if (!commentsData[currentTeacher]) {
        commentsData[currentTeacher] = [];
    }
    commentsData[currentTeacher].push(comment);
    
    // 保存到 localStorage
    localStorage.setItem('commentsData', JSON.stringify(commentsData));
    
    // 重新加载评论列表
    loadCommentsForTeacher(currentTeacher);
    
    input.value = '';
}

// 删除老师评论
function removeTeacherComment(index) {
    if (!currentTeacher || !commentsData[currentTeacher]) return;
    
    // 从数组中删除
    commentsData[currentTeacher].splice(index, 1);
    
    // 保存到 localStorage
    localStorage.setItem('commentsData', JSON.stringify(commentsData));
    
    // 重新加载评论列表
    loadCommentsForTeacher(currentTeacher);
}

// ===== 主留言板功能 =====

// 加载主留言板评论
function loadMainComments() {
    var commentList = document.getElementById('mainCommentList');
    var comments = commentsData.main || [];
    
    if (comments.length === 0) {
        commentList.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无留言，快来发表第一个留言吧！</p>';
        return;
    }
    
    var html = '';
    comments.forEach(function(comment, index) {
        var timestamp = new Date(comment.timestamp);
        var timeStr = timestamp.toLocaleString();
        var currentTime = Date.now();
        var timeDiff = currentTime - comment.timestamp;
        var canDelete = timeDiff <= 60000; // 1分钟内可撤回
        
        html += `
            <div class="comment-item" data-index="${index}">
                <div class="comment-author">${comment.author}</div>
                <div class="comment-text">${comment.text}</div>
                <div class="comment-time">${timeStr}</div>
                <div class="comment-actions">
                    ${canDelete ? `<button class="comment-delete" onclick="removeMainComment(${index})">撤回</button>` : ''}
                </div>
            </div>
        `;
    });
    
    commentList.innerHTML = html;
}

// 添加主留言板评论
function addMainComment() {
    var input = document.getElementById('mainCommentInput');
    var text = input.value.trim();
    if (!text) {
        alert('请输入留言内容！');
        return;
    }
    
    // 创建评论对象
    var comment = {
        author: '访客',
        text: text,
        timestamp: Date.now()
    };
    
    // 保存到主留言板
    if (!commentsData.main) {
        commentsData.main = [];
    }
    commentsData.main.push(comment);
    
    // 保存到 localStorage
    localStorage.setItem('commentsData', JSON.stringify(commentsData));
    
    // 重新加载评论列表
    loadMainComments();
    
    input.value = '';
}

// 删除主留言板评论（1分钟内）
function removeMainComment(index) {
    if (!commentsData.main) return;
    
    var comment = commentsData.main[index];
    var currentTime = Date.now();
    var timeDiff = currentTime - comment.timestamp;
    
    if (timeDiff > 60000) {
        alert('只能撤回1分钟内的留言！');
        return;
    }
    
    // 从数组中删除
    commentsData.main.splice(index, 1);
    
    // 保存到 localStorage
    localStorage.setItem('commentsData', JSON.stringify(commentsData));
    
    // 重新加载评论列表
    loadMainComments();
}

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    // 加载主留言板评论
    loadMainComments();
    
    // ESC键关闭模态框
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('teacherModal').classList.contains('active')) {
            closeTeacherModal();
        }
    });
});

// 其他原有功能保持不变...
</script>

<!-- 其他原有脚本保持不变 -->

</body>
</html>
